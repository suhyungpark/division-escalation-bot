name: 확전 번역봇

on:
  schedule:
    # GitHub 예약 실행은 지정한 시각을 지키지 않는다. 실측(8/28~8/29)으로
    # 00:08 · 21:21 · 07:53 UTC 에 돌았는데 어느 것도 지정한 슬롯이 아니었다.
    # 그래서 시각을 맞추려 애쓰는 대신, 깨어난 뒤 새 글이 올 때까지
    # 자리를 지키게 한다. 몇 시에 깨어나든 그날 것을 잡는다.
    - cron: "11 */3 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "전송하지 않고 확인만"
        type: boolean
        default: false
      force:
        description: "이미 올린 날짜여도 다시 전송"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 카탈로그 생성
        run: python build_catalog.py

      - name: 확전 확인 및 전송
        timeout-minutes: 330
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SOURCE_BOT_NAME: ${{ vars.SOURCE_BOT_NAME }}
        run: |
          ARGS="--watch 300 --interval 300"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python bot.py $ARGS

      - name: 만든 이미지 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escalation-png
          path: out/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 사전 보강분과 스케줄 유지 흔적 커밋
        if: always()
        run: |
          # GitHub은 저장소에 60일간 변화가 없으면 예약 실행을 꺼버린다.
          # 사전이 거의 다 차서 자동 보강 커밋이 잘 안 생기므로,
          # 달이 바뀔 때 흔적을 하나 남겨 그 일이 없게 한다. 한 달에 한 번뿐이다.
          STAMP=$(date -u +%Y-%m)
          if [ "$(cat data/heartbeat.txt 2>/dev/null)" != "$STAMP" ]; then
            echo "$STAMP" > data/heartbeat.txt
            echo "스케줄 유지 흔적 갱신: $STAMP"
          fi
          git add data/overrides.json data/heartbeat.txt
          if git diff --staged --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git config user.name "escalation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "사전 보강 · 스케줄 유지 [skip ci]"
          git pull --rebase --autostash origin main
          git push
