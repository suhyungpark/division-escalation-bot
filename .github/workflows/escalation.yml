name: 확전 번역봇

on:
  schedule:
    # 원문 봇 게시 시각 분포 — 3개월 116건 실측 (UTC)
    #   08시 79 · 09시 4 · 10시 6 · 11시 7 · 12시 2 · 13시 5 · 14시 7 · 15시 4 · 01시 2
    #
    # 정각은 피한다. GitHub 문서가 "매시 정각은 부하가 몰려 예약 실행이 지연된다"고
    # 명시하고 있고, 실제로 08-28에 09:00·10:00·11:00 세 번이 모두 돌지 않았다.
    # 어중간한 분으로 옮기고 시간당 두 번 확인해 한 번 놓쳐도 30분 뒤 따라잡는다.
    - cron: "7,27,47 8 * * *"     # 가장 몰리는 구간
    - cron: "13,43 9-16 * * *"    # 한국시간 18시~새벽 1시, 30분 간격
    - cron: "17 1,3 * * *"        # 자정 한참 넘겨 올라온 것 회수

  workflow_dispatch:
    inputs:
      dry_run:
        description: "전송하지 않고 확인만"
        type: boolean
        default: false
      force:
        description: "이미 올린 날짜여도 다시 전송"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 카탈로그 생성
        run: python build_catalog.py

      - name: 확전 확인 및 전송
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SOURCE_BOT_NAME: ${{ vars.SOURCE_BOT_NAME }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python bot.py $ARGS

      - name: 만든 이미지 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escalation-png
          path: out/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 사전 보강분과 스케줄 유지 흔적 커밋
        if: always()
        run: |
          # GitHub은 저장소에 60일간 변화가 없으면 예약 실행을 꺼버린다.
          # 사전이 거의 다 차서 자동 보강 커밋이 잘 안 생기므로,
          # 달이 바뀔 때 흔적을 하나 남겨 그 일이 없게 한다. 한 달에 한 번뿐이다.
          STAMP=$(date -u +%Y-%m)
          if [ "$(cat data/heartbeat.txt 2>/dev/null)" != "$STAMP" ]; then
            echo "$STAMP" > data/heartbeat.txt
            echo "스케줄 유지 흔적 갱신: $STAMP"
          fi
          git add data/overrides.json data/heartbeat.txt
          if git diff --staged --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git config user.name "escalation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "사전 보강 · 스케줄 유지 [skip ci]"
          git pull --rebase --autostash origin main
          git push
